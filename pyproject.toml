[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omnibioai-sdk"
version = "0.2.0"
description = "Python SDK for OmniBioAI APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Manish Kumar" }]

dependencies = [
  "requests>=2.31.0"
]

keywords = ["bioinformatics", "sdk", "api", "omnibioai"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
# MCP server (omnibioai-mcp): Literature AI as tools for Claude, ChatGPT and
# other MCP clients. Optional so the core SDK stays requests-only.
mcp = [
  "mcp>=2,<3"
]
dev = [
  "mcp>=2,<3",
  "pytest>=8",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "build>=1.2",
  "twine>=5.1",
  "ruff>=0.6"
]

[project.scripts]
omnibioai-mcp = "omnibioai.mcp_server:main"

[project.urls]
Homepage = "https://github.com/man4ish/omnibioai_sdk"
Source = "https://github.com/man4ish/omnibioai_sdk"
Issues = "https://github.com/man4ish/omnibioai_sdk/issues"

[tool.hatch.build.targets.wheel]
# omnibioai_sdk is now a thin backward-compatibility shim over omnibioai
# (SDK Phase 2 -- see omnibioai_sdk/__init__.py) -- both ship in the same
# `omnibioai-sdk` PyPI distribution so `pip install omnibioai-sdk` is
# unchanged for existing users, while new code imports `from omnibioai
# import OmniBioAI`.
packages = ["omnibioai", "omnibioai_sdk"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes + pycodestyle errors. Formatting itself is black/isort's job
# (see CONTRIBUTING.md); the explicit selection keeps CI stable when a new
# ruff release changes its default rule set.
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=omnibioai",
  "--cov=omnibioai_sdk",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]

[tool.coverage.run]
branch = true
source = ["omnibioai", "omnibioai_sdk"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pass",
]